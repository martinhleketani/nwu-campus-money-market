<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - NWU Campus Money Market</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span>NWU</span> Campus Money Market
        </div>

        <a href="../index.html" class="login-btn">
            ← Back to Home
        </a>

    </header>


    <main>

        <section class="auth-section">

            <div class="auth-card">

                <div class="auth-header">

                    <span class="badge">
                        🎓 NWU STUDENT REGISTRATION
                    </span>

                    <h1>Create Account</h1>

                    <p>
                        Join the NWU student marketplace.
                    </p>

                </div>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="studentNumber">
                            NWU Student Number
                        </label>

                        <input
                            type="text"
                            id="studentNumber"
                            placeholder="Enter your NWU student number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Student Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your student email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="campus">
                            Campus
                        </label>

                        <select id="campus" required>

                            <option value="">
                                Select your campus
                            </option>

                            <option value="Potchefstroom">
                                Potchefstroom
                            </option>

                            <option value="Mahikeng">
                                Mahikeng
                            </option>

                            <option value="Vanderbijlpark">
                                Vanderbijlpark
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="role">
                            Account Type
                        </label>

                        <select id="role" required>

                            <option value="">
                                Select account type
                            </option>

                            <option value="buyer">
                                Buyer
                            </option>

                            <option value="seller">
                                Seller
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <label class="terms">

                        <input
                            type="checkbox"
                            required
                        >

                        I agree to the marketplace terms and conditions.

                    </label>


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Create Account
                    </button>

                </form>


                <div class="auth-footer">

                    <p>
                        Already have an account?
                        <a href="login.html">
                            Login
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
