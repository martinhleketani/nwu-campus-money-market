<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - NWU Campus Money Market
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>


<header class="navbar">

    <div class="logo">
        <span>NWU</span>
        Campus Money Market
    </div>

    <div class="nav-buttons">

        <a
            href="../index.html"
            class="login-btn"
        >
            Home
        </a>

        <a
            href="register.html"
            class="register-btn"
        >
            Register
        </a>

    </div>

</header>


<main class="login-page">

    <div class="login-container">

        <div
            style="
                text-align:center;
                margin-bottom:25px;
            "
        >

            <div style="font-size:45px;">
                🎓
            </div>

            <h1>
                Login
            </h1>

            <p>
                NWU Campus Money Market
            </p>

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="loginUsername">
                    Student Number / Admin Username
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Student number or admin"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    required
                >

            </div>


            <div
                style="
                    display:flex;
                    gap:8px;
                    align-items:center;
                    margin-bottom:20px;
                "
            >

                <input
                    type="checkbox"
                    id="showPassword"
                >

                <label for="showPassword">
                    Show password
                </label>

            </div>


            <button
                type="submit"
                class="form-button"
            >
                Login
            </button>


        </form>


        <div class="form-help">

            <p>
                Don't have an account?
            </p>

            <a href="register.html">
                Register here
            </a>

        </div>

    </div>

</main>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /*
        =========================================
        DEMO ADMIN ACCOUNT
        =========================================
        */

        const ADMIN_USERNAME =
            "admin";

        const ADMIN_PASSWORD =
            "NWUAdmin@2026";


        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const usernameInput =
            document.getElementById(
                "loginUsername"
            );

        const passwordInput =
            document.getElementById(
                "loginPassword"
            );

        const showPassword =
            document.getElementById(
                "showPassword"
            );


        showPassword.addEventListener(
            "change",
            function () {

                passwordInput.type =
                    showPassword.checked
                        ? "text"
                        : "password";

            }
        );


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const username =
                    usernameInput
                        .value
                        .trim();

                const password =
                    passwordInput
                        .value;


                /*
                =================================
                ADMIN LOGIN
                =================================
                */

                if (
                    username.toLowerCase() ===
                        ADMIN_USERNAME &&
                    password ===
                        ADMIN_PASSWORD
                ) {

                    const adminSession = {

                        username:
                            ADMIN_USERNAME,

                        accountType:
                            "admin",

                        loggedIn:
                            true

                    };


                    localStorage.setItem(
                        "currentUser",
                        JSON.stringify(
                            adminSession
                        )
                    );


                    alert(
                        "Admin login successful."
                    );


                    window.location.href =
                        "admin-dashboard.html";

                    return;
                }


                if (
                    username.toLowerCase() ===
                    ADMIN_USERNAME
                ) {

                    alert(
                        "Incorrect admin password."
                    );

                    return;
                }


                /*
                =================================
                STUDENT LOGIN
                =================================
                */

                const users =
                    JSON.parse(
                        localStorage.getItem(
                            "registeredUsers"
                        )
                    ) || [];


                const user =
                    users.find(
                        function (registeredUser) {

                            return (
                                registeredUser.studentNumber ===
                                username
                            );

                        }
                    );


                if (!user) {

                    alert(
                        "Account not found. Please register first."
                    );

                    return;
                }


                if (
                    user.password !==
                    password
                ) {

                    alert(
                        "Incorrect password."
                    );

                    return;
                }


                const currentUser = {

                    id:
                        user.id,

                    fullName:
                        user.fullName,

                    studentNumber:
                        user.studentNumber,

                    email:
                        user.email,

                    phone:
                        user.phone,

                    campus:
                        user.campus,

                    accountType:
                        user.accountType,

                    loggedIn:
                        true

                };


                localStorage.setItem(
                    "currentUser",
                    JSON.stringify(
                        currentUser
                    )
                );


                if (
                    user.accountType ===
                    "buyer"
                ) {

                    window.location.href =
                        "buyer-dashboard.html";

                    return;
                }


                if (
                    user.accountType ===
                    "seller"
                ) {

                    window.location.href =
                        "seller-dashboard.html";

                    return;
                }


                alert(
                    "Invalid account type."
                );

            }
        );

    }
);

</script>

</body>

</html>
