<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Marketplace - NWU Campus Money Market
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <style>

        .marketplace-page {

            min-height: 100vh;

            background: #f7f9fc;

            padding: 40px 7%;
        }


        .marketplace-container {

            max-width: 1250px;

            margin: auto;
        }


        .marketplace-header {

            margin-bottom: 25px;
        }


        .marketplace-header p {

            color: #6b7280;
        }


        .campus-message {

            margin-top: 12px;

            color: #007749;

            font-weight: 700;
        }


        /*
        =====================================
        FILTERS
        =====================================
        */

        .marketplace-filters {

            background: white;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 30px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.05);

            display: grid;

            grid-template-columns:
                2fr repeat(4, 1fr);

            gap: 10px;
        }


        .marketplace-filters input,
        .marketplace-filters select {

            width: 100%;

            padding: 12px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;
        }


        /*
        =====================================
        PRODUCT GRID
        =====================================
        */

        .product-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;
        }


        .product-card {

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 13px;

            overflow: hidden;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.04);
        }


        /*
        =====================================
        BOOK / PRODUCT IMAGE
        =====================================
        */

        .product-image {

            height: 260px;

            background: #eef2f7;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            font-size: 65px;
        }


        .product-image img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            background: white;
        }


        .product-info {

            padding: 18px;
        }


        .module-label {

            display: inline-block;

            background: #e5f5ed;

            color: #007749;

            padding: 5px 9px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: 800;

            margin-bottom: 8px;
        }


        .product-info h3 {

            margin-bottom: 8px;
        }


        .book-details {

            color: #4b5563;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 10px;
        }


        .product-price {

            color: #007749;

            font-size: 22px;

            font-weight: 800;

            margin: 10px 0;
        }


        .product-meta {

            color: #6b7280;

            font-size: 13px;

            line-height: 1.7;
        }


        .product-description {

            margin-top: 10px;

            color: #4b5563;

            font-size: 14px;
        }


        /*
        =====================================
        BUTTONS
        =====================================
        */

        .product-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-top: 15px;
        }


        .cart-button {

            flex: 1;

            min-width: 120px;

            border: none;

            background: #007749;

            color: white;

            padding: 10px;

            border-radius: 6px;

            font-weight: 700;

            cursor: pointer;
        }


        .google-button {

            border:
                1px solid #d1d5db;

            background: white;

            padding: 10px;

            border-radius: 6px;

            font-weight: 700;

            cursor: pointer;
        }


        .empty-marketplace {

            display: none;

            text-align: center;

            background: white;

            padding: 50px;

            border-radius: 12px;

            color: #6b7280;
        }


        @media (
            max-width: 1000px
        ) {

            .marketplace-filters {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .product-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (
            max-width: 600px
        ) {

            .marketplace-filters {

                grid-template-columns: 1fr;
            }


            .product-grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>



<header class="navbar">


    <div class="logo">

        <span>NWU</span>
        Campus Money Market

    </div>


    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="marketplace.html">
            Marketplace
        </a>

        <a
            href="buyer-dashboard.html"
            id="buyerLink"
            style="display:none;"
        >
            Buyer Dashboard
        </a>

        <a
            href="seller-dashboard.html"
            id="sellerLink"
            style="display:none;"
        >
            Seller Dashboard
        </a>

        <a
            href="admin-dashboard.html"
            id="adminLink"
            style="display:none;"
        >
            Admin
        </a>

    </nav>


    <div class="nav-buttons">


        <a
            href="login.html"
            class="login-btn"
            id="loginLink"
        >
            Login
        </a>


        <a
            href="register.html"
            class="register-btn"
            id="registerLink"
        >
            Register
        </a>


        <button
            class="register-btn"
            id="logoutButton"
            style="display:none;"
        >
            Logout
        </button>


    </div>


</header>



<main class="marketplace-page">


    <div class="marketplace-container">


        <section class="marketplace-header">


            <span class="badge">
                🎓 NWU STUDENT MARKETPLACE
            </span>


            <h1>
                Campus Marketplace
            </h1>


            <p>
                Buy textbooks and other products
                from NWU students.
            </p>


            <div
                class="campus-message"
                id="campusMessage"
            >
            </div>


        </section>



        <!-- ===================================
             FILTERS
        ==================================== -->

        <section class="marketplace-filters">


            <input
                type="text"
                id="searchInput"
                placeholder="Search books or products..."
            >


            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="books">
                    📚 Textbooks
                </option>

                <option value="phones">
                    📱 Phones
                </option>

                <option value="laptops">
                    💻 Laptops
                </option>

                <option value="electronics">
                    🎧 Electronics
                </option>

                <option value="accessories">
                    🔌 Accessories
                </option>

                <option value="clothing">
                    👕 Clothing
                </option>

                <option value="furniture">
                    🪑 Furniture
                </option>

                <option value="gaming">
                    🎮 Gaming
                </option>

                <option value="other">
                    📦 Other
                </option>

            </select>



            <select id="subjectFilter">

                <option value="all">
                    All Subjects
                </option>

                <option value="CMPG">
                    CMPG
                </option>

                <option value="Accounting">
                    Accounting
                </option>

            </select>



            <select id="yearFilter">

                <option value="all">
                    All Years
                </option>

                <option value="1">
                    First Year
                </option>

                <option value="2">
                    Second Year
                </option>

                <option value="3">
                    Third Year
                </option>

            </select>



            <select id="moduleFilter">

                <option value="all">
                    All Modules
                </option>

            </select>


        </section>



        <!-- PRODUCTS -->

        <section>


            <div
                class="product-grid"
                id="productGrid"
            >
            </div>


            <div
                class="empty-marketplace"
                id="emptyMarketplace"
            >

                <h2>
                    No products found
                </h2>

                <p>
                    There are currently no matching
                    listings for this campus.
                </p>

            </div>


        </section>


    </div>


</main>



<footer>

    <p>

        ©
        <span id="currentYear"></span>

        NWU Campus Money Market

    </p>

</footer>



<!-- MODULE/TEXTBOOK DATABASE -->

<script src="../js/textbooks.js"></script>



<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /*
        ==========================================
        CURRENT USER
        ==========================================
        */

        const currentUser =
            JSON.parse(
                localStorage.getItem(
                    "currentUser"
                )
            );



        /*
        ==========================================
        NAVIGATION
        ==========================================
        */

        const loginLink =
            document.getElementById(
                "loginLink"
            );


        const registerLink =
            document.getElementById(
                "registerLink"
            );


        const logoutButton =
            document.getElementById(
                "logoutButton"
            );


        const buyerLink =
            document.getElementById(
                "buyerLink"
            );


        const sellerLink =
            document.getElementById(
                "sellerLink"
            );


        const adminLink =
            document.getElementById(
                "adminLink"
            );


        if (
            currentUser &&
            currentUser.loggedIn
        ) {


            loginLink.style.display =
                "none";


            registerLink.style.display =
                "none";


            logoutButton.style.display =
                "inline-block";


            if (
                currentUser.accountType ===
                "buyer"
            ) {

                buyerLink.style.display =
                    "inline-block";

            }


            if (
                currentUser.accountType ===
                "seller"
            ) {

                sellerLink.style.display =
                    "inline-block";

            }


            if (
                currentUser.accountType ===
                "admin"
            ) {

                adminLink.style.display =
                    "inline-block";

            }

        }



        /*
        ==========================================
        CAMPUS
        ==========================================
        */

        const campusMessage =
            document.getElementById(
                "campusMessage"
            );


        if (
            currentUser &&
            currentUser.campus
        ) {


            campusMessage.textContent =

                "📍 Showing products available at " +
                currentUser.campus +
                ".";


        } else {


            campusMessage.textContent =

                "Login to see listings for your NWU campus.";


        }



        /*
        ==========================================
        PRODUCTS
        ==========================================
        */

        const sellerProducts =
            JSON.parse(
                localStorage.getItem(
                    "sellerListings"
                )
            ) || [];



        /*
        Logged-in students see their own campus.

        Logged-out users can currently view listings.
        We can make login compulsory later when
        NWU authentication is implemented.
        */

        function getCampusProducts() {


            if (
                currentUser &&
                currentUser.campus
            ) {


                return sellerProducts.filter(
                    function (product) {


                        return (
                            product.campus ===
                            currentUser.campus
                        );


                    }
                );

            }


            return sellerProducts;

        }



        /*
        ==========================================
        ELEMENTS
        ==========================================
        */

        const productGrid =
            document.getElementById(
                "productGrid"
            );


        const emptyMarketplace =
            document.getElementById(
                "emptyMarketplace"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const categoryFilter =
            document.getElementById(
                "categoryFilter"
            );


        const subjectFilter =
            document.getElementById(
                "subjectFilter"
            );


        const yearFilter =
            document.getElementById(
                "yearFilter"
            );


        const moduleFilter =
            document.getElementById(
                "moduleFilter"
            );



        /*
        ==========================================
        MODULE FILTER
        ==========================================
        */

        function loadModuleFilter() {


            moduleFilter.innerHTML =

                '<option value="all">All Modules</option>';


            const subject =
                subjectFilter.value;


            const year =
                yearFilter.value;



            let modules = [];



            if (
                subject !== "all" &&
                year !== "all"
            ) {


                modules =
                    NWU_MODULES[subject]?.[year] ||
                    [];


            } else {


                Object.values(
                    NWU_MODULES
                ).forEach(
                    function (subjectYears) {


                        Object.values(
                            subjectYears
                        ).forEach(
                            function (yearModules) {


                                modules.push(
                                    ...yearModules
                                );


                            }
                        );


                    }
                );

            }



            modules = [
                ...new Set(modules)
            ];



            modules.forEach(
                function (moduleCode) {


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        moduleCode;


                    option.textContent =
                        moduleCode;


                    moduleFilter.appendChild(
                        option
                    );


                }
            );


        }



        /*
        ==========================================
        CATEGORY ICON
        ==========================================
        */

        function getCategoryIcon(
            category
        ) {


            const icons = {

                books: "📚",
                phones: "📱",
                laptops: "💻",
                electronics: "🎧",
                accessories: "🔌",
                clothing: "👕",
                furniture: "🪑",
                gaming: "🎮",
                other: "📦"

            };


            return (
                icons[category] ||
                "📦"
            );

        }



        /*
        ==========================================
        CREATE PRODUCT CARD
        ==========================================
        */

        function createProductCard(
            product
        ) {


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "product-card";



            /*
            IMAGE PRIORITY:

            1. Seller's actual uploaded photo
            2. Verified catalogue cover
            3. Category icon
            */

            const imageContainer =
                document.createElement(
                    "div"
                );


            imageContainer.className =
                "product-image";



            let displayImage =
                product.image || "";



            if (
                !displayImage &&
                product.module
            ) {


                const catalogueBook =
                    findTextbookByModule(
                        product.module
                    );


                if (
                    catalogueBook &&
                    catalogueBook.cover
                ) {


                    displayImage =
                        catalogueBook.cover;


                }

            }



            if (displayImage) {


                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    displayImage;


                image.alt =
                    product.name;


                imageContainer.appendChild(
                    image
                );


            } else {


                imageContainer.textContent =
                    getCategoryIcon(
                        product.category
                    );


            }



            /*
            INFO
            */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "product-info";



            if (
                product.module
            ) {


                const moduleLabel =
                    document.createElement(
                        "div"
                    );


                moduleLabel.className =
                    "module-label";


                moduleLabel.textContent =
                    product.module;


                info.appendChild(
                    moduleLabel
                );

            }



            const title =
                document.createElement(
                    "h3"
                );


            title.textContent =
                product.name ||
                "Unnamed Product";


            info.appendChild(
                title
            );



            /*
            BOOK INFORMATION
            */

            if (
                product.category ===
                "books"
            ) {


                const details =
                    document.createElement(
                        "div"
                    );


                details.className =
                    "book-details";



                if (
                    product.author
                ) {


                    const author =
                        document.createElement(
                            "div"
                        );


                    author.textContent =
                        "Author: " +
                        product.author;


                    details.appendChild(
                        author
                    );

                }



                if (
                    product.edition
                ) {


                    const edition =
                        document.createElement(
                            "div"
                        );


                    edition.textContent =
                        product.edition;


                    details.appendChild(
                        edition
                    );

                }



                if (
                    product.isbn
                ) {


                    const isbn =
                        document.createElement(
                            "div"
                        );


                    isbn.textContent =
                        "ISBN: " +
                        product.isbn;


                    details.appendChild(
                        isbn
                    );

                }


                info.appendChild(
                    details
                );

            }



            /*
            PRICE
            */

            const price =
                document.createElement(
                    "div"
                );


            price.className =
                "product-price";


            price.textContent =
                "R" +
                Number(
                    product.price ||
                    0
                )
                .toLocaleString();


            info.appendChild(
                price
            );



            /*
            META
            */

            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "product-meta";


            meta.innerHTML = `

                <div>
                    📍 ${product.campus || "NWU"}
                </div>

                <div>
                    Condition:
                    ${product.condition || "Not specified"}
                </div>

                <div>
                    Seller:
                    ${product.sellerName || "NWU Student"}
                </div>

            `;


            info.appendChild(
                meta
            );



            if (
                product.description
            ) {


                const description =
                    document.createElement(
                        "p"
                    );


                description.className =
                    "product-description";


                description.textContent =
                    product.description;


                info.appendChild(
                    description
                );

            }



            /*
            ACTIONS
            */

            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "product-actions";



            const cartButton =
                document.createElement(
                    "button"
                );


            cartButton.className =
                "cart-button";


            cartButton.textContent =
                "Add to Cart";


            cartButton.addEventListener(
                "click",
                function () {


                    addToCart(
                        product
                    );


                }
            );


            actions.appendChild(
                cartButton
            );



            /*
            GOOGLE BOOK SEARCH
            */

            if (
                product.category ===
                "books"
            ) {


                const googleButton =
                    document.createElement(
                        "button"
                    );


                googleButton.className =
                    "google-button";


                googleButton.textContent =
                    "🔎 Google Book";


                googleButton.addEventListener(
                    "click",
                    function () {


                        const catalogueBook =
                            product.module
                                ? findTextbookByModule(
                                    product.module
                                  )
                                : null;



                        const searchTerm =

                            product.isbn ||

                            catalogueBook?.googleQuery ||

                            (
                                (
                                    product.bookTitle ||
                                    product.name ||
                                    ""
                                ) +

                                " " +

                                (
                                    product.author ||
                                    ""
                                ) +

                                " " +

                                (
                                    product.edition ||
                                    ""
                                )
                            );



                        window.open(

                            "https://www.google.com/search?q=" +
                            encodeURIComponent(
                                searchTerm
                            ),

                            "_blank"

                        );


                    }
                );


                actions.appendChild(
                    googleButton
                );

            }



            info.appendChild(
                actions
            );


            card.append(
                imageContainer,
                info
            );


            return card;

        }



        /*
        ==========================================
        DISPLAY
        ==========================================
        */

        function displayProducts(
            products
        ) {


            productGrid.innerHTML =
                "";


            if (
                products.length === 0
            ) {


                emptyMarketplace.style.display =
                    "block";


                return;

            }


            emptyMarketplace.style.display =
                "none";


            products.forEach(
                function (product) {


                    productGrid.appendChild(
                        createProductCard(
                            product
                        )
                    );


                }
            );


        }



        /*
        ==========================================
        FILTER
        ==========================================
        */

        function filterProducts() {


            const search =
                searchInput
                    .value
                    .toLowerCase()
                    .trim();


            const category =
                categoryFilter.value;


            const subject =
                subjectFilter.value;


            const year =
                yearFilter.value;


            const module =
                moduleFilter.value;



            const products =
                getCampusProducts()
                    .filter(
                        function (product) {


                            const searchable =

                                (
                                    product.name ||
                                    ""
                                ) +

                                " " +

                                (
                                    product.description ||
                                    ""
                                ) +

                                " " +

                                (
                                    product.module ||
                                    ""
                                ) +

                                " " +

                                (
                                    product.author ||
                                    ""
                                ) +

                                " " +

                                (
                                    product.isbn ||
                                    ""
                                );



                            const matchesSearch =
                                searchable
                                    .toLowerCase()
                                    .includes(
                                        search
                                    );


                            const matchesCategory =

                                category === "all" ||

                                product.category ===
                                    category;


                            const matchesSubject =

                                subject === "all" ||

                                product.subject ===
                                    subject;


                            const matchesYear =

                                year === "all" ||

                                String(
                                    product.studyYear
                                ) ===
                                String(
                                    year
                                );


                            const matchesModule =

                                module === "all" ||

                                product.module ===
                                    module;



                            return (

                                matchesSearch &&
                                matchesCategory &&
                                matchesSubject &&
                                matchesYear &&
                                matchesModule

                            );


                        }
                    );


            displayProducts(
                products
            );


        }



        /*
        ==========================================
        CART
        ==========================================
        */

        function addToCart(
            product
        ) {


            if (
                !currentUser ||
                !currentUser.loggedIn ||
                currentUser.accountType !==
                    "buyer"
            ) {


                alert(
                    "Please login with a buyer account to add products to your cart."
                );


                window.location.href =
                    "login.html";


                return;

            }



            let cart =
                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    )
                ) || [];



            const existing =
                cart.find(
                    function (item) {


                        return (
                            String(item.id) ===
                            String(product.id)
                        );


                    }
                );



            if (existing) {


                existing.quantity =
                    (
                        Number(
                            existing.quantity
                        ) ||
                        1
                    ) + 1;


            } else {


                cart.push({

                    id:
                        product.id,

                    name:
                        product.name,

                    price:
                        Number(
                            product.price
                        ),

                    image:
                        product.image || "",

                    module:
                        product.module || "",

                    campus:
                        product.campus,

                    sellerName:
                        product.sellerName,

                    quantity:
                        1

                });


            }



            localStorage.setItem(
                "cart",
                JSON.stringify(
                    cart
                )
            );


            alert(
                product.name +
                " added to your cart."
            );


        }



        /*
        ==========================================
        EVENTS
        ==========================================
        */

        searchInput.addEventListener(
            "input",
            filterProducts
        );


        categoryFilter.addEventListener(
            "change",
            filterProducts
        );


        subjectFilter.addEventListener(
            "change",
            function () {


                loadModuleFilter();

                filterProducts();


            }
        );


        yearFilter.addEventListener(
            "change",
            function () {


                loadModuleFilter();

                filterProducts();


            }
        );


        moduleFilter.addEventListener(
            "change",
            filterProducts
        );



        /*
        ==========================================
        LOGOUT
        ==========================================
        */

        logoutButton.addEventListener(
            "click",
            function () {


                localStorage.removeItem(
                    "currentUser"
                );


                window.location.href =
                    "login.html";


            }
        );



        /*
        ==========================================
        YEAR
        ==========================================
        */

        document.getElementById(
            "currentYear"
        ).textContent =
            new Date().getFullYear();



        /*
        ==========================================
        INITIAL LOAD
        ==========================================
        */

        loadModuleFilter();


        displayProducts(
            getCampusProducts()
        );


    }
);

</script>


</body>

</html>
