<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Seller Dashboard - NWU Campus Money Market
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <style>

        .seller-page {
            min-height: 100vh;
            background: #f7f9fc;
            padding: 40px 7%;
        }


        .seller-container {
            max-width: 1200px;
            margin: auto;
        }


        .seller-header {
            margin-bottom: 30px;
        }


        .seller-header p {
            color: #6b7280;
        }


        .seller-layout {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 30px;
        }


        .seller-card {

            background: white;

            padding: 25px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.05);
        }


        .seller-card h2 {
            margin-bottom: 20px;
        }


        .form-group {
            margin-bottom: 16px;
        }


        .form-group label {

            display: block;

            font-weight: 700;

            margin-bottom: 6px;
        }


        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;

            padding: 12px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            outline: none;
        }


        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }


        .form-group small {

            display: block;

            margin-top: 5px;

            color: #6b7280;
        }


        #bookFields {

            padding: 18px;

            margin-bottom: 18px;

            background: #f3f8f5;

            border:
                1px solid #d5e9de;

            border-radius: 10px;
        }


        .book-heading {

            margin-bottom: 15px;

            color: #007749;
        }


        .publish-button {

            width: 100%;

            border: none;

            padding: 13px;

            background: #007749;

            color: white;

            border-radius: 7px;

            font-weight: 700;

            cursor: pointer;
        }


        .publish-button:hover {
            background: #005f3a;
        }


        .listing {

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

            padding: 15px;

            margin-bottom: 15px;
        }


        .listing-image {

            width: 100%;

            height: 180px;

            object-fit: cover;

            border-radius: 8px;

            margin-bottom: 12px;

            background: #f3f4f6;
        }


        .listing h3 {
            margin-bottom: 6px;
        }


        .listing-module {

            color: #007749;

            font-weight: 800;

            margin-bottom: 6px;
        }


        .listing-price {

            color: #007749;

            font-size: 20px;

            font-weight: 800;

            margin: 8px 0;
        }


        .delete-button {

            margin-top: 10px;

            border: none;

            padding: 9px 13px;

            border-radius: 6px;

            background: #dc2626;

            color: white;

            cursor: pointer;
        }


        .empty-listings {

            color: #6b7280;

            text-align: center;

            padding: 30px 10px;
        }


        @media (
            max-width: 850px
        ) {

            .seller-layout {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<script>

(function () {

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );


    if (
        !currentUser ||
        !currentUser.loggedIn ||
        currentUser.accountType !==
            "seller"
    ) {

        alert(
            "Please login with a seller account."
        );

        window.location.replace(
            "login.html"
        );

    }

})();

</script>



<header class="navbar">


    <div class="logo">

        <span>NWU</span>
        Campus Money Market

    </div>


    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="marketplace.html">
            Marketplace
        </a>

        <a href="seller-dashboard.html">
            Seller Dashboard
        </a>

    </nav>


    <div class="nav-buttons">

        <button
            class="register-btn"
            id="logoutButton"
        >
            Logout
        </button>

    </div>


</header>



<main class="seller-page">


    <div class="seller-container">


        <section class="seller-header">

            <span class="badge">
                🏪 SELLER
            </span>

            <h1>
                Seller Dashboard
            </h1>

            <p id="sellerWelcome">
            </p>

        </section>



        <div class="seller-layout">


            <!-- =================================
                 PRODUCT FORM
            ================================== -->

            <section class="seller-card">


                <h2>
                    List a Product
                </h2>


                <form id="productForm">


                    <div class="form-group">

                        <label for="productCategory">
                            Product Category
                        </label>

                        <select
                            id="productCategory"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="books">
                                📚 Textbook
                            </option>

                            <option value="phones">
                                📱 Phone
                            </option>

                            <option value="laptops">
                                💻 Laptop
                            </option>

                            <option value="electronics">
                                🎧 Electronics
                            </option>

                            <option value="accessories">
                                🔌 Accessories
                            </option>

                            <option value="clothing">
                                👕 Clothing
                            </option>

                            <option value="furniture">
                                🪑 Furniture
                            </option>

                            <option value="gaming">
                                🎮 Gaming
                            </option>

                            <option value="other">
                                📦 Other
                            </option>

                        </select>

                    </div>



                    <!-- NORMAL PRODUCT NAME -->

                    <div
                        class="form-group"
                        id="normalProductNameGroup"
                    >

                        <label for="productName">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="productName"
                            placeholder="Example: Samsung Galaxy"
                        >

                    </div>



                    <!-- =================================
                         TEXTBOOK INFORMATION
                    ================================== -->

                    <div
                        id="bookFields"
                        style="display:none;"
                    >


                        <h3 class="book-heading">
                            📚 Textbook Information
                        </h3>


                        <div class="form-group">

                            <label for="bookSubject">
                                Subject
                            </label>

                            <select id="bookSubject">

                                <option value="">
                                    Select subject
                                </option>

                                <option value="CMPG">
                                    CMPG / Computer Science
                                </option>

                                <option value="Accounting">
                                    Accounting
                                </option>

                            </select>

                        </div>



                        <div class="form-group">

                            <label for="bookYear">
                                Study Year
                            </label>

                            <select id="bookYear">

                                <option value="">
                                    Select year
                                </option>

                                <option value="1">
                                    First Year
                                </option>

                                <option value="2">
                                    Second Year
                                </option>

                                <option value="3">
                                    Third Year
                                </option>

                            </select>

                        </div>



                        <div class="form-group">

                            <label for="bookModule">
                                Module
                            </label>

                            <select id="bookModule">

                                <option value="">
                                    Select module
                                </option>

                            </select>

                        </div>



                        <div class="form-group">

                            <label for="bookTitle">
                                Book Title
                            </label>

                            <input
                                type="text"
                                id="bookTitle"
                                placeholder="Textbook title"
                            >

                        </div>



                        <div class="form-group">

                            <label for="bookAuthor">
                                Author
                            </label>

                            <input
                                type="text"
                                id="bookAuthor"
                                placeholder="Book author"
                            >

                        </div>



                        <div class="form-group">

                            <label for="bookEdition">
                                Edition
                            </label>

                            <input
                                type="text"
                                id="bookEdition"
                                placeholder="Example: 5th Edition"
                            >

                        </div>



                        <div class="form-group">

                            <label for="bookISBN">
                                ISBN
                            </label>

                            <input
                                type="text"
                                id="bookISBN"
                                placeholder="ISBN if available"
                            >

                        </div>


                    </div>



                    <!-- PRICE -->

                    <div class="form-group">

                        <label for="productPrice">
                            Price (R)
                        </label>

                        <input
                            type="number"
                            id="productPrice"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>



                    <!-- CAMPUS -->

                    <div class="form-group">

                        <label for="productCampus">
                            Selling Campus
                        </label>

                        <input
                            type="text"
                            id="productCampus"
                            readonly
                        >

                        <small>
                            Your registered campus determines
                            where this product is sold.
                        </small>

                    </div>



                    <!-- CONDITION -->

                    <div class="form-group">

                        <label for="productCondition">
                            Condition
                        </label>

                        <select
                            id="productCondition"
                            required
                        >

                            <option value="">
                                Select condition
                            </option>

                            <option value="New">
                                New
                            </option>

                            <option value="Like New">
                                Like New
                            </option>

                            <option value="Good">
                                Good
                            </option>

                            <option value="Fair">
                                Fair
                            </option>

                        </select>

                    </div>



                    <!-- DESCRIPTION -->

                    <div class="form-group">

                        <label for="productDescription">
                            Description
                        </label>

                        <textarea
                            id="productDescription"
                            placeholder="Describe the condition of your product..."
                        ></textarea>

                    </div>



                    <!-- PHOTO -->

                    <div class="form-group">

                        <label for="productImage">
                            Product / Book Photo
                        </label>

                        <input
                            type="file"
                            id="productImage"
                            accept="image/*"
                        >

                        <small>
                            For textbooks, upload a clear photo
                            of the actual book you are selling.
                        </small>

                    </div>



                    <button
                        type="submit"
                        class="publish-button"
                    >
                        Publish Product
                    </button>


                </form>


            </section>



            <!-- =================================
                 SELLER LISTINGS
            ================================== -->

            <section class="seller-card">


                <h2>
                    My Listings
                </h2>


                <div id="sellerListings">
                </div>


            </section>


        </div>


    </div>


</main>



<footer>

    <p>

        ©
        <span id="currentYear"></span>

        NWU Campus Money Market

    </p>

</footer>



<!-- TEXTBOOK DATABASE -->

<script src="../js/textbooks.js"></script>



<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const currentUser =
            JSON.parse(
                localStorage.getItem(
                    "currentUser"
                )
            );


        /*
        ========================================
        ELEMENTS
        ========================================
        */

        const productForm =
            document.getElementById(
                "productForm"
            );


        const productCategory =
            document.getElementById(
                "productCategory"
            );


        const productName =
            document.getElementById(
                "productName"
            );


        const normalProductNameGroup =
            document.getElementById(
                "normalProductNameGroup"
            );


        const productPrice =
            document.getElementById(
                "productPrice"
            );


        const productCampus =
            document.getElementById(
                "productCampus"
            );


        const productCondition =
            document.getElementById(
                "productCondition"
            );


        const productDescription =
            document.getElementById(
                "productDescription"
            );


        const productImage =
            document.getElementById(
                "productImage"
            );


        const bookFields =
            document.getElementById(
                "bookFields"
            );


        const bookSubject =
            document.getElementById(
                "bookSubject"
            );


        const bookYear =
            document.getElementById(
                "bookYear"
            );


        const bookModule =
            document.getElementById(
                "bookModule"
            );


        const bookTitle =
            document.getElementById(
                "bookTitle"
            );


        const bookAuthor =
            document.getElementById(
                "bookAuthor"
            );


        const bookEdition =
            document.getElementById(
                "bookEdition"
            );


        const bookISBN =
            document.getElementById(
                "bookISBN"
            );


        const listingsContainer =
            document.getElementById(
                "sellerListings"
            );



        /*
        ========================================
        USER INFORMATION
        ========================================
        */

        document.getElementById(
            "sellerWelcome"
        ).textContent =

            "Welcome, " +
            (
                currentUser.fullName ||
                "Seller"
            ) +
            ". Your selling area is " +
            (
                currentUser.campus ||
                "your registered campus"
            ) +
            ".";


        productCampus.value =
            currentUser.campus || "";



        /*
        ========================================
        IMAGE
        ========================================
        */

        let selectedImage = "";


        productImage.addEventListener(
            "change",
            function () {


                const file =
                    productImage.files[0];


                if (!file) {

                    selectedImage = "";

                    return;

                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        selectedImage =
                            event.target.result;

                    };


                reader.readAsDataURL(
                    file
                );


            }
        );



        /*
        ========================================
        CATEGORY
        ========================================
        */

        productCategory.addEventListener(
            "change",
            function () {


                if (
                    productCategory.value ===
                    "books"
                ) {

                    bookFields.style.display =
                        "block";

                    normalProductNameGroup
                        .style.display =
                        "none";

                } else {

                    bookFields.style.display =
                        "none";

                    normalProductNameGroup
                        .style.display =
                        "block";

                }


            }
        );



        /*
        ========================================
        LOAD MODULES
        ========================================
        */

        function loadModules() {


            bookModule.innerHTML =
                '<option value="">Select module</option>';


            const subject =
                bookSubject.value;


            const year =
                bookYear.value;


            if (
                !subject ||
                !year ||
                !NWU_MODULES[subject]
            ) {

                return;

            }


            const modules =
                NWU_MODULES[subject][year] ||
                [];


            modules.forEach(
                function (moduleCode) {


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        moduleCode;


                    option.textContent =
                        moduleCode;


                    bookModule.appendChild(
                        option
                    );


                }
            );


        }


        bookSubject.addEventListener(
            "change",
            loadModules
        );


        bookYear.addEventListener(
            "change",
            loadModules
        );



        /*
        ========================================
        AUTO-FILL VERIFIED BOOK
        ========================================
        */

        bookModule.addEventListener(
            "change",
            function () {


                const textbook =
                    findTextbookByModule(
                        bookModule.value
                    );


                /*
                Clear previous values first.
                */

                bookTitle.value = "";
                bookAuthor.value = "";
                bookEdition.value = "";
                bookISBN.value = "";


                if (!textbook) {

                    return;

                }


                bookTitle.value =
                    textbook.title || "";


                bookAuthor.value =
                    textbook.author || "";


                bookEdition.value =
                    textbook.edition || "";


                bookISBN.value =
                    textbook.isbn || "";


            }
        );



        /*
        ========================================
        LISTINGS
        ========================================
        */

        let listings =
            JSON.parse(
                localStorage.getItem(
                    "sellerListings"
                )
            ) || [];



        function displayListings() {


            listingsContainer.innerHTML =
                "";


            const myListings =
                listings.filter(
                    function (product) {


                        return (
                            String(
                                product.sellerId
                            ) ===
                            String(
                                currentUser.studentNumber
                            )
                        );


                    }
                );


            if (
                myListings.length === 0
            ) {


                listingsContainer.innerHTML = `

                    <div class="empty-listings">

                        You have not published
                        any products yet.

                    </div>

                `;


                return;

            }



            myListings.forEach(
                function (product) {


                    const listing =
                        document.createElement(
                            "div"
                        );


                    listing.className =
                        "listing";



                    if (
                        product.image
                    ) {


                        const image =
                            document.createElement(
                                "img"
                            );


                        image.src =
                            product.image;


                        image.alt =
                            product.name;


                        image.className =
                            "listing-image";


                        listing.appendChild(
                            image
                        );


                    }



                    if (
                        product.module
                    ) {


                        const module =
                            document.createElement(
                                "div"
                            );


                        module.className =
                            "listing-module";


                        module.textContent =
                            product.module;


                        listing.appendChild(
                            module
                        );


                    }



                    const title =
                        document.createElement(
                            "h3"
                        );


                    title.textContent =
                        product.name;


                    listing.appendChild(
                        title
                    );



                    if (
                        product.edition
                    ) {


                        const edition =
                            document.createElement(
                                "p"
                            );


                        edition.textContent =
                            product.edition;


                        listing.appendChild(
                            edition
                        );


                    }



                    const price =
                        document.createElement(
                            "div"
                        );


                    price.className =
                        "listing-price";


                    price.textContent =
                        "R" +
                        Number(
                            product.price
                        )
                        .toLocaleString();


                    listing.appendChild(
                        price
                    );



                    const campus =
                        document.createElement(
                            "p"
                        );


                    campus.textContent =
                        "📍 " +
                        product.campus;


                    listing.appendChild(
                        campus
                    );



                    const removeButton =
                        document.createElement(
                            "button"
                        );


                    removeButton.className =
                        "delete-button";


                    removeButton.textContent =
                        "Delete Listing";


                    removeButton.addEventListener(
                        "click",
                        function () {


                            const confirmed =
                                confirm(
                                    "Delete this listing?"
                                );


                            if (!confirmed) {

                                return;

                            }


                            listings =
                                listings.filter(
                                    function (item) {


                                        return (
                                            String(item.id) !==
                                            String(product.id)
                                        );


                                    }
                                );


                            localStorage.setItem(
                                "sellerListings",
                                JSON.stringify(
                                    listings
                                )
                            );


                            displayListings();


                        }
                    );


                    listing.appendChild(
                        removeButton
                    );


                    listingsContainer
                        .appendChild(
                            listing
                        );


                }
            );


        }



        /*
        ========================================
        PUBLISH PRODUCT
        ========================================
        */

        productForm.addEventListener(
            "submit",
            function (event) {


                event.preventDefault();



                const category =
                    productCategory.value;


                if (!category) {

                    alert(
                        "Please select a category."
                    );

                    return;

                }



                let finalName =
                    productName.value.trim();



                /*
                TEXTBOOK VALIDATION
                */

                if (
                    category === "books"
                ) {


                    if (
                        !bookSubject.value ||
                        !bookYear.value ||
                        !bookModule.value ||
                        !bookTitle.value.trim()
                    ) {


                        alert(
                            "Please complete the textbook information."
                        );


                        return;

                    }


                    finalName =
                        bookTitle.value.trim();


                } else {


                    if (!finalName) {


                        alert(
                            "Please enter the product name."
                        );


                        return;

                    }


                }



                const product = {


                    id:
                        Date.now(),


                    name:
                        finalName,


                    category:
                        category,


                    price:
                        Number(
                            productPrice.value
                        ),


                    /*
                    IMPORTANT:
                    Campus comes from account.
                    Seller cannot select another campus.
                    */

                    campus:
                        currentUser.campus,


                    condition:
                        productCondition.value,


                    description:
                        productDescription
                            .value
                            .trim(),


                    image:
                        selectedImage,


                    sellerId:
                        currentUser.studentNumber,


                    sellerName:
                        currentUser.fullName,


                    /*
                    TEXTBOOK INFORMATION
                    */

                    module:
                        category === "books"
                            ? bookModule.value
                            : "",


                    subject:
                        category === "books"
                            ? bookSubject.value
                            : "",


                    studyYear:
                        category === "books"
                            ? Number(
                                bookYear.value
                              )
                            : null,


                    bookTitle:
                        category === "books"
                            ? bookTitle.value.trim()
                            : "",


                    author:
                        category === "books"
                            ? bookAuthor.value.trim()
                            : "",


                    edition:
                        category === "books"
                            ? bookEdition.value.trim()
                            : "",


                    isbn:
                        category === "books"
                            ? bookISBN.value.trim()
                            : "",


                    createdAt:
                        new Date().toISOString()


                };



                listings.push(
                    product
                );


                localStorage.setItem(
                    "sellerListings",
                    JSON.stringify(
                        listings
                    )
                );



                alert(
                    "Product published successfully."
                );


                productForm.reset();


                selectedImage = "";


                productCampus.value =
                    currentUser.campus || "";


                bookFields.style.display =
                    "none";


                normalProductNameGroup
                    .style.display =
                    "block";


                displayListings();


            }
        );



        /*
        ========================================
        LOGOUT
        ========================================
        */

        document.getElementById(
            "logoutButton"
        ).addEventListener(
            "click",
            function () {


                localStorage.removeItem(
                    "currentUser"
                );


                window.location.href =
                    "login.html";


            }
        );



        /*
        ========================================
        YEAR
        ========================================
        */

        document.getElementById(
            "currentYear"
        ).textContent =
            new Date().getFullYear();



        displayListings();


    }
);

</script>


</body>

</html>
