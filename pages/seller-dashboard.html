<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Seller Dashboard - NWU Campus Money Market
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <style>

        .seller-page {
            padding: 50px 7%;
            background: #f7f9fc;
            min-height: 100vh;
        }

        .seller-info {
            max-width: 1200px;
            margin: 0 auto 25px;
            padding: 25px;
            background: #007749;
            color: white;
            border-radius: 14px;
        }

        .seller-layout {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns:
                400px 1fr;
            gap: 25px;
        }

        .seller-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.06);
        }

        .seller-card h2 {
            margin-bottom: 20px;
        }

        .listing-grid {
            display: grid;
            grid-template-columns:
                repeat(2,1fr);
            gap: 15px;
        }

        .listing-card {
            border:
                1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
        }

        .listing-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 7px;
            margin-bottom: 10px;
        }

        .delete-listing {
            margin-top: 12px;
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 6px;
            background: #dc2626;
            color: white;
            cursor: pointer;
        }

        .empty-listings {
            color: #6b7280;
            padding: 30px;
        }

        @media (
            max-width: 900px
        ) {

            .seller-layout {
                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


<script>

(function () {

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );


    if (
        !currentUser ||
        !currentUser.loggedIn ||
        currentUser.accountType !==
            "seller"
    ) {

        alert(
            "Please login with a seller account."
        );

        window.location.replace(
            "login.html"
        );

    }

})();

</script>


<header class="navbar">

    <div class="logo">

        <span>NWU</span>
        Campus Money Market

    </div>


    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="marketplace.html">
            Marketplace
        </a>

        <a href="seller-dashboard.html">
            Seller Dashboard
        </a>

    </nav>


    <div class="nav-buttons">

        <button
            class="register-btn"
            id="logoutButton"
        >
            Logout
        </button>

    </div>

</header>


<main class="seller-page">


    <section class="seller-info">

        <h1>
            Seller Dashboard
        </h1>

        <p>

            Welcome,

            <strong id="sellerName">
                NWU Student
            </strong>

        </p>

    </section>


    <div class="seller-layout">


        <section class="seller-card">

            <h2>
                Add Product
            </h2>


            <form id="productForm">


                <div class="form-group">

                    <label for="productName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="productCategory">
                        Category
                    </label>

                    <select
                        id="productCategory"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option value="books">
                            Books
                        </option>

                        <option value="phones">
                            Phones
                        </option>

                        <option value="laptops">
                            Laptops
                        </option>

                        <option value="electronics">
                            Electronics
                        </option>

                        <option value="accessories">
                            Accessories
                        </option>

                        <option value="clothing">
                            Clothing
                        </option>

                        <option value="furniture">
                            Furniture
                        </option>

                        <option value="gaming">
                            Gaming
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="productPrice">
                        Price (R)
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        min="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="productCampus">
                        Campus
                    </label>

                    <select
                        id="productCampus"
                        required
                    >

                        <option value="">
                            Select campus
                        </option>

                        <option value="potchefstroom">
                            Potchefstroom
                        </option>

                        <option value="mahikeng">
                            Mahikeng
                        </option>

                        <option value="vanderbijlpark">
                            Vanderbijlpark
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="productCondition">
                        Condition
                    </label>

                    <select
                        id="productCondition"
                        required
                    >

                        <option value="">
                            Select condition
                        </option>

                        <option value="new">
                            New
                        </option>

                        <option value="like-new">
                            Like New
                        </option>

                        <option value="good">
                            Good
                        </option>

                        <option value="fair">
                            Fair
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="productDescription">
                        Description
                    </label>

                    <textarea
                        id="productDescription"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="productImage">
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                    >

                </div>


                <button
                    type="submit"
                    class="form-button"
                >
                    Publish Product
                </button>

            </form>

        </section>


        <section class="seller-card">

            <h2>
                Your Listings
            </h2>

            <div
                id="sellerListings"
                class="listing-grid"
            >
            </div>

        </section>


    </div>

</main>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const currentUser =
            JSON.parse(
                localStorage.getItem(
                    "currentUser"
                )
            );


        document
            .getElementById(
                "sellerName"
            )
            .textContent =
                currentUser.fullName;


        const productForm =
            document.getElementById(
                "productForm"
            );

        const productImage =
            document.getElementById(
                "productImage"
            );

        const listingContainer =
            document.getElementById(
                "sellerListings"
            );


        let selectedImage =
            "";


        let listings =
            JSON.parse(
                localStorage.getItem(
                    "sellerListings"
                )
            ) || [];


        productImage.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];


                if (!file) {

                    selectedImage =
                        "";

                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        selectedImage =
                            event.target.result;

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );


        function saveListings() {

            localStorage.setItem(
                "sellerListings",
                JSON.stringify(
                    listings
                )
            );

        }


        function displayListings() {


            listingContainer.innerHTML =
                "";


            const myListings =
                listings.filter(
                    function (product) {

                        return (
                            product.sellerId ===
                            currentUser.studentNumber
                        );

                    }
                );


            if (
                myListings.length === 0
            ) {

                listingContainer.innerHTML =
                    `
                    <div class="empty-listings">
                        You have not published any products yet.
                    </div>
                    `;

                return;
            }


            myListings.forEach(
                function (product) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "listing-card";


                    if (
                        product.image
                    ) {

                        const image =
                            document.createElement(
                                "img"
                            );

                        image.src =
                            product.image;

                        image.alt =
                            product.name;

                        card.appendChild(
                            image
                        );

                    }


                    const title =
                        document.createElement(
                            "h3"
                        );

                    title.textContent =
                        product.name;


                    const price =
                        document.createElement(
                            "p"
                        );

                    price.textContent =
                        `R${Number(
                            product.price
                        ).toLocaleString()}`;


                    const location =
                        document.createElement(
                            "p"
                        );

                    location.textContent =
                        product.campus;


                    const condition =
                        document.createElement(
                            "p"
                        );

                    condition.textContent =
                        `Condition: ${product.condition}`;


                    const removeButton =
                        document.createElement(
                            "button"
                        );

                    removeButton.className =
                        "delete-listing";

                    removeButton.textContent =
                        "Delete Listing";


                    removeButton.addEventListener(
                        "click",
                        function () {

                            const confirmed =
                                confirm(
                                    "Delete this listing?"
                                );


                            if (!confirmed) {

                                return;

                            }


                            listings =
                                listings.filter(
                                    function (
                                        listing
                                    ) {

                                        return (
                                            listing.id !==
                                            product.id
                                        );

                                    }
                                );


                            saveListings();

                            displayListings();

                        }
                    );


                    card.append(
                        title,
                        price,
                        location,
                        condition,
                        removeButton
                    );


                    listingContainer.appendChild(
                        card
                    );

                }
            );

        }


        productForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById(
                            "productName"
                        )
                        .value
                        .trim();


                const category =
                    document
                        .getElementById(
                            "productCategory"
                        )
                        .value;


                const price =
                    Number(
                        document
                            .getElementById(
                                "productPrice"
                            )
                            .value
                    );


                const campus =
                    document
                        .getElementById(
                            "productCampus"
                        )
                        .value;


                const condition =
                    document
                        .getElementById(
                            "productCondition"
                        )
                        .value;


                const description =
                    document
                        .getElementById(
                            "productDescription"
                        )
                        .value
                        .trim();


                if (
                    price <= 0
                ) {

                    alert(
                        "Please enter a valid price."
                    );

                    return;
                }


                const product = {

                    id:
                        Date.now(),

                    name:
                        name,

                    category:
                        category,

                    price:
                        price,

                    campus:
                        campus,

                    condition:
                        condition,

                    description:
                        description,

                    image:
                        selectedImage,

                    sellerId:
                        currentUser.studentNumber,

                    sellerName:
                        currentUser.fullName,

                    createdAt:
                        new Date().toISOString()

                };


                listings.push(
                    product
                );


                saveListings();


                productForm.reset();

                selectedImage =
                    "";


                displayListings();


                alert(
                    "Product published successfully."
                );

            }
        );


        document
            .getElementById(
                "logoutButton"
            )
            .addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "currentUser"
                    );


                    window.location.href =
                        "login.html";

                }
            );


        displayListings();

    }
);

</script>

</body>

</html>
