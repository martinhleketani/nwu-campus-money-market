<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Buyer Dashboard - NWU Campus Money Market
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .buyer-page {
            padding: 50px 7%;
            background: #f7f9fc;
            min-height: 100vh;
        }

        .buyer-welcome {
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 25px;
            background: #007749;
            color: white;
            border-radius: 14px;
        }

        .buyer-welcome p {
            color: #e1f1e9;
        }

        .buyer-layout {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        .buyer-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.06);
        }

        .cart-item {
            border-bottom:
                1px solid #e5e7eb;
            padding: 15px 0;
        }

        .cart-item h4 {
            margin-bottom: 5px;
        }

        .cart-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .cart-actions button {
            border: none;
            padding: 7px 11px;
            border-radius: 5px;
            cursor: pointer;
        }

        .quantity-button {
            background: #e5e7eb;
        }

        .remove-button {
            background: #dc2626;
            color: white;
        }

        .cart-total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .checkout-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #007749;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .empty-cart {
            color: #6b7280;
            padding: 25px 0;
        }

        @media (
            max-width: 850px
        ) {

            .buyer-layout {
                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


<script>

(function () {

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );


    if (
        !currentUser ||
        !currentUser.loggedIn ||
        currentUser.accountType !==
            "buyer"
    ) {

        alert(
            "Please login with a buyer account."
        );

        window.location.replace(
            "login.html"
        );

    }

})();

</script>


<header class="navbar">

    <div class="logo">
        <span>NWU</span>
        Campus Money Market
    </div>


    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="marketplace.html">
            Marketplace
        </a>

        <a href="buyer-dashboard.html">
            Buyer Dashboard
        </a>

    </nav>


    <div class="nav-buttons">

        <button
            class="register-btn"
            id="logoutButton"
        >
            Logout
        </button>

    </div>

</header>


<main class="buyer-page">


    <section class="buyer-welcome">

        <h1>
            Welcome,
            <span id="buyerName">
                NWU Student
            </span>
            👋
        </h1>

        <p>
            Manage your shopping cart and
            marketplace purchases.
        </p>

    </section>


    <div class="buyer-layout">


        <section class="buyer-card">

            <h2>
                🛍️ Marketplace
            </h2>

            <p style="margin:15px 0 25px;">

                Browse products being sold
                by NWU students.

            </p>


            <a
                href="marketplace.html"
                class="primary-btn"
            >
                Browse Marketplace
            </a>

        </section>


        <aside class="buyer-card">

            <h2>
                🛒 Your Cart
                (<span id="cartCount">0</span>)
            </h2>


            <div id="cartItems">

                <div class="empty-cart">
                    Your cart is empty.
                </div>

            </div>


            <div class="cart-total">

                Total:
                R<span id="cartTotal">
                    0
                </span>

            </div>


            <button
                class="checkout-btn"
                id="checkoutButton"
            >
                Proceed to Checkout
            </button>

        </aside>

    </div>

</main>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const currentUser =
            JSON.parse(
                localStorage.getItem(
                    "currentUser"
                )
            );


        document
            .getElementById(
                "buyerName"
            )
            .textContent =
                currentUser.fullName;


        let cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                )
            ) || [];


        const cartItems =
            document.getElementById(
                "cartItems"
            );

        const cartTotal =
            document.getElementById(
                "cartTotal"
            );

        const cartCount =
            document.getElementById(
                "cartCount"
            );


        function saveCart() {

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

        }


        function displayCart() {


            cartItems.innerHTML =
                "";


            if (
                cart.length === 0
            ) {

                cartItems.innerHTML =
                    `
                    <div class="empty-cart">
                        Your cart is empty.
                    </div>
                    `;

                cartTotal.textContent =
                    "0";

                cartCount.textContent =
                    "0";

                return;
            }


            let total =
                0;

            let quantityTotal =
                0;


            cart.forEach(
                function (
                    item,
                    index
                ) {


                    const price =
                        Number(
                            item.price
                        ) || 0;

                    const quantity =
                        Number(
                            item.quantity
                        ) || 1;


                    total +=
                        price *
                        quantity;

                    quantityTotal +=
                        quantity;


                    const cartItem =
                        document.createElement(
                            "div"
                        );


                    cartItem.className =
                        "cart-item";


                    const title =
                        document.createElement(
                            "h4"
                        );

                    title.textContent =
                        item.name;


                    const priceText =
                        document.createElement(
                            "p"
                        );

                    priceText.textContent =
                        `R${price.toLocaleString()} × ${quantity}`;


                    const actions =
                        document.createElement(
                            "div"
                        );

                    actions.className =
                        "cart-actions";


                    const minus =
                        document.createElement(
                            "button"
                        );

                    minus.textContent =
                        "−";

                    minus.className =
                        "quantity-button";


                    minus.addEventListener(
                        "click",
                        function () {

                            if (
                                cart[index]
                                    .quantity >
                                1
                            ) {

                                cart[index]
                                    .quantity--;

                            } else {

                                cart.splice(
                                    index,
                                    1
                                );

                            }


                            saveCart();

                            displayCart();

                        }
                    );


                    const plus =
                        document.createElement(
                            "button"
                        );

                    plus.textContent =
                        "+";

                    plus.className =
                        "quantity-button";


                    plus.addEventListener(
                        "click",
                        function () {

                            cart[index]
                                .quantity =
                                quantity + 1;


                            saveCart();

                            displayCart();

                        }
                    );


                    const remove =
                        document.createElement(
                            "button"
                        );

                    remove.textContent =
                        "Remove";

                    remove.className =
                        "remove-button";


                    remove.addEventListener(
                        "click",
                        function () {

                            cart.splice(
                                index,
                                1
                            );

                            saveCart();

                            displayCart();

                        }
                    );


                    actions.append(
                        minus,
                        plus,
                        remove
                    );


                    cartItem.append(
                        title,
                        priceText,
                        actions
                    );


                    cartItems.appendChild(
                        cartItem
                    );

                }
            );


            cartTotal.textContent =
                total.toLocaleString();


            cartCount.textContent =
                quantityTotal;

        }


        document
            .getElementById(
                "checkoutButton"
            )
            .addEventListener(
                "click",
                function () {

                    if (
                        cart.length === 0
                    ) {

                        alert(
                            "Your cart is empty."
                        );

                        return;
                    }


                    alert(
                        "Checkout will be connected to the payment/order system later."
                    );

                }
            );


        document
            .getElementById(
                "logoutButton"
            )
            .addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "currentUser"
                    );


                    window.location.href =
                        "login.html";

                }
            );


        displayCart();

    }
);

</script>

</body>

</html>
