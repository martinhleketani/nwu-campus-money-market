<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - NWU Campus Money Market</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>


<body>

    <!-- ==========================================
         NAVIGATION
    =========================================== -->

    <header class="navbar">

        <div class="logo">
            <span>NWU</span> Campus Money Market
        </div>

        <div class="nav-buttons">

            <a
                href="../index.html"
                class="login-btn"
            >
                ← Back to Home
            </a>

        </div>

    </header>


    <!-- ==========================================
         REGISTRATION SECTION
    =========================================== -->

    <main>

        <section class="auth-section">

            <div class="auth-card">


                <!-- HEADER -->

                <div class="auth-header">

                    <span class="badge">
                        🎓 NWU STUDENT REGISTRATION
                    </span>

                    <h1>
                        Create Account
                    </h1>

                    <p>
                        Join the NWU student marketplace.
                    </p>

                </div>


                <!-- ==========================================
                     REGISTRATION FORM
                =========================================== -->

                <form id="registerForm">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- STUDENT NUMBER -->

                    <div class="form-group">

                        <label for="studentNumber">
                            NWU Student Number
                        </label>

                        <input
                            type="text"
                            id="studentNumber"
                            name="studentNumber"
                            placeholder="Enter your NWU student number"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Student Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your student email"
                            required
                        >

                    </div>


                    <!-- CAMPUS -->

                    <div class="form-group">

                        <label for="campus">
                            Campus
                        </label>

                        <select
                            id="campus"
                            name="campus"
                            required
                        >

                            <option value="">
                                Select your campus
                            </option>

                            <option value="Potchefstroom">
                                Potchefstroom
                            </option>

                            <option value="Mahikeng">
                                Mahikeng
                            </option>

                            <option value="Vanderbijlpark">
                                Vanderbijlpark
                            </option>

                        </select>

                    </div>


                    <!-- ACCOUNT TYPE -->

                    <div class="form-group">

                        <label for="role">
                            Account Type
                        </label>

                        <select
                            id="role"
                            name="role"
                            required
                        >

                            <option value="">
                                Select account type
                            </option>

                            <option value="buyer">
                                Buyer
                            </option>

                            <option value="seller">
                                Seller
                            </option>

                        </select>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="8"
                            required
                        >

                    </div>


                    <!-- TERMS -->

                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the marketplace terms and conditions.

                    </label>


                    <!-- SUBMIT BUTTON -->

                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Create Account
                    </button>

                </form>


                <!-- ==========================================
                     LOGIN LINK
                =========================================== -->

                <div class="auth-footer">

                    <p>
                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="../js/script.js"></script>

</body>

</html>
