<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - NWU Campus Money Market</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <span>NWU</span> Campus Money Market
    </div>

    <div class="nav-buttons">
        <a href="../index.html" class="login-btn">
            Home
        </a>

        <a href="login.html" class="register-btn">
            Login
        </a>
    </div>
</header>


<main class="login-page">

    <div class="login-container">

        <div style="text-align:center; margin-bottom:25px;">

            <div style="font-size:45px;">
                🎓
            </div>

            <h1>Create Account</h1>

            <p>NWU Campus Money Market</p>

        </div>


        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="studentNumber">
                    NWU Student Number
                </label>

                <input
                    type="text"
                    id="studentNumber"
                    placeholder="Enter your student number"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">
                    Student Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="student@nwu.ac.za"
                    required
                >
            </div>


            <div class="form-group">
                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>


            <div class="form-group">
                <label for="campus">
                    NWU Campus
                </label>

                <select id="campus" required>

                    <option value="">
                        Select your campus
                    </option>

                    <option value="potchefstroom">
                        Potchefstroom
                    </option>

                    <option value="mahikeng">
                        Mahikeng
                    </option>

                    <option value="vanderbijlpark">
                        Vanderbijlpark
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label for="accountType">
                    Account Type
                </label>

                <select id="accountType" required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="buyer">
                        Buyer
                    </option>

                    <option value="seller">
                        Seller
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    minlength="8"
                    placeholder="Minimum 8 characters"
                    required
                >
            </div>


            <div class="form-group">
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    placeholder="Confirm your password"
                    required
                >
            </div>


            <div style="
                display:flex;
                gap:10px;
                align-items:flex-start;
                margin-bottom:20px;
            ">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">
                    I agree to use the NWU Campus Money
                    Market responsibly.
                </label>

            </div>


            <button
                type="submit"
                class="form-button"
            >
                Create Account
            </button>

        </form>


        <div class="form-help">

            <p>Already registered?</p>

            <a href="login.html">
                Login here
            </a>

        </div>

    </div>

</main>


<script>

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();

            const studentNumber =
                document
                    .getElementById("studentNumber")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();

            const campus =
                document
                    .getElementById("campus")
                    .value;

            const accountType =
                document
                    .getElementById("accountType")
                    .value;

            const password =
                document
                    .getElementById("registerPassword")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            if (studentNumber.length < 5) {

                alert(
                    "Please enter a valid student number."
                );

                return;
            }


            if (password.length < 8) {

                alert(
                    "Password must contain at least 8 characters."
                );

                return;
            }


            if (password !== confirmPassword) {

                alert(
                    "Passwords do not match."
                );

                return;
            }


            let users =
                JSON.parse(
                    localStorage.getItem(
                        "registeredUsers"
                    )
                ) || [];


            const studentExists =
                users.some(
                    function (user) {

                        return (
                            user.studentNumber ===
                            studentNumber
                        );

                    }
                );


            if (studentExists) {

                alert(
                    "An account with this student number already exists."
                );

                return;
            }


            const emailExists =
                users.some(
                    function (user) {

                        return (
                            user.email.toLowerCase() ===
                            email.toLowerCase()
                        );

                    }
                );


            if (emailExists) {

                alert(
                    "An account with this email already exists."
                );

                return;
            }


            const newUser = {

                id: Date.now(),

                fullName:
                    fullName,

                studentNumber:
                    studentNumber,

                email:
                    email,

                phone:
                    phone,

                campus:
                    campus,

                accountType:
                    accountType,

                password:
                    password,

                createdAt:
                    new Date().toISOString()

            };


            users.push(
                newUser
            );


            localStorage.setItem(
                "registeredUsers",
                JSON.stringify(users)
            );


            alert(
                "Account created successfully! You can now login."
            );


            window.location.href =
                "login.html";

        }
    );

</script>

</body>

</html>
